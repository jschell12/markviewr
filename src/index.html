<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; script-src 'self';" />
  <title>MarkViewr</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <button id="open-folder-btn" title="Open Folder (Cmd+O)">📂 Open Folder</button>
        <input type="text" id="sidebar-search" placeholder="Search across files…" autocomplete="off" />
      </div>
      <div id="tree-container">
        <div id="empty-state">
          <p>No folder open</p>
          <p class="hint">Open a repository folder to view its Markdown files</p>
        </div>
        <ul id="file-tree"></ul>
        <div id="search-results" class="hidden"></div>
      </div>
    </aside>
    <div id="divider" title="Drag to resize, double-click to reset"></div>
    <main id="content">
      <div id="welcome">
        <h1>MarkViewr</h1>
        <p>Open a folder to browse its Markdown files.</p>
        <p class="shortcut">⌘O / Ctrl+O</p>
      </div>
      <div id="find-bar" class="hidden">
        <input type="text" id="find-input" placeholder="Find in document…" autocomplete="off" />
        <span id="find-count"></span>
        <button id="find-prev" title="Previous (Shift+Enter)">▲</button>
        <button id="find-next" title="Next (Enter)">▼</button>
        <button id="find-close" title="Close (Escape)">✕</button>
      </div>
      <div id="markdown-header" class="hidden">
        <span id="file-path-display"></span>
      </div>
      <article id="markdown-body"></article>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
